# H3TVR Sosig Weapon Loadouts Configuration
# This file defines advanced weapon loadouts for spawned sosigs

[LoadoutDefaults]
# Default settings for all weapon loadouts
DefaultAmmoCount=100
DefaultAccuracyModifier=1.0
DefaultDamageModifier=1.0
DefaultFireRateModifier=1.0
EnableRandomAttachments=true
AttachmentChance=0.3

[AssaultRifleLoadout]
Name=Assault Rifle Specialist
Description=Standard military rifle configuration
PrimaryWeapon=FVRObject_AK74
SecondaryWeapon=FVRObject_Glock17
Attachments=Scope_ACOG,Foregrip_Standard,Muzzle_Compensator
AmmoCount=120
AccuracyModifier=1.2
DamageModifier=1.0
FireRateModifier=1.1
Weight=0.8

[SniperLoadout]
Name=Marksman Specialist
Description=Long-range precision configuration
PrimaryWeapon=FVRObject_M24
SecondaryWeapon=FVRObject_M1911
Attachments=Scope_Sniper,Bipod_Standard,Muzzle_Suppressor
AmmoCount=40
AccuracyModifier=2.0
DamageModifier=1.5
FireRateModifier=0.7
Weight=0.3

[SMGLoadout]
