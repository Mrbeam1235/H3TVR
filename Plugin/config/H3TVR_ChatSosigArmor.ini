# H3TVR Chat Sosig Armor Configuration
# This file defines various armor sets that can be applied to spawned chat sosigs
# Each armor set has different chances for different armor pieces
# 
# Format:
# [ArmorSetName]
# description=Description of the armor set
# headwear_chance=0.0-1.0 (chance to spawn with headwear)
# facewear_chance=0.0-1.0 (chance to spawn with facewear)
# eyewear_chance=0.0-1.0 (chance to spawn with eyewear)
# torsowear_chance=0.0-1.0 (chance to spawn with body armor)
# pantswear_chance=0.0-1.0 (chance to spawn with leg armor)
# backpack_chance=0.0-1.0 (chance to spawn with backpack)
# armor_level=None/Light/Medium/Heavy/Elite (overall armor protection level)

