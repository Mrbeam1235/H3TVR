# H3TVR Optional Dependencies Configuration
# This file controls how H3TVR integrates with optional mod dependencies

[Stovepipe Integration]
# Stovepipe mod adds realistic weapon jamming mechanics
# GitHub: https://github.com/SmidgeonE/Stovepipe
EnableStovepipeIntegration = true

# === MALFUNCTION CHANCES BY CONTEXT ===
# Base malfunction chances for different scenarios (0.0 = never, 1.0 = always)
StovepipeChanceNormal = 0.01          # Normal usage (1%)
StovepipeChanceCombat = 0.03          # Combat stress increases jam chance (3%)
StovepipeChanceDirty = 0.08           # Dirty/fouled weapons jam more (8%)
StovepipeChancePlayer = 0.02          # Player weapons (2%)
StovepipeChanceEnemy = 0.04           # Enemy weapons (4%)
StovepipeChanceAlly = 0.015           # Allied weapons (1.5%)
StovepipeChanceElite = 0.005          # Elite weapons (0.5%)
StovepipeChanceBoss = 0.001           # Boss weapons (0.1%)
StovepipeChanceWornOut = 0.12         # Worn out weapons (12%)
StovepipeChanceOverheated = 0.06      # Overheated weapons (6%)

# === WEAPON CATEGORY MULTIPLIERS ===
# Multipliers applied to base chances based on weapon type
StovepipePistolMultiplier = 1.2       # Pistols jam slightly more often
StovepipeRifleMultiplier = 0.8        # Rifles are generally reliable
StovepipeShotgunMultiplier = 0.6      # Shotguns rarely jam
StovepipeSMGMultiplier = 1.4          # SMGs have higher jam rates
StovepipeLMGMultiplier = 1.1          # Machine guns jam under stress
StovepipeAssaultRifleMultiplier = 0.9 # Assault rifles are well-designed
StovepipeSniperMultiplier = 0.7       # Precision rifles are reliable
StovepipeRevolverMultiplier = 0.3     # Revolvers rarely "jam"
StovepipeBoltMultiplier = 0.2         # Bolt actions almost never jam
StovepipePumpMultiplier = 0.4         # Pump actions are simple/reliable

# === MALFUNCTION TYPE CHANCES ===
# Relative probability of different malfunction types
StovepipeStovepipeChance = 1.5        # Classic stovepipe jam
StovepipeDoubleFeedChance = 1.0       # Double feed malfunction
StovepipeFailureToFeedChance = 1.2    # Failure to feed
StovepipeFailureToEjectChance = 1.1   # Failure to eject
StovepipeFailureToFireChance = 0.8    # Failure to fire
StovepipeHangFireChance = 0.3         # Hang fire (delayed ignition)

# === FEATURE TOGGLES ===
# Enable/disable specific Stovepipe features
StovepipeAutoClearJams = false        # Automatically clear jams after delay
StovepipeContextualMalfunctions = true # Use H3TVR's contextual logic
StovepipeRealisticJamTypes = true     # Use realistic jam types per weapon
StovepipeEnableCooldowns = true       # Prevent rapid consecutive jams
StovepipeEnableCaching = true         # Cache jam capability results
StovepipeDirtAccumulation = true      # Simulate dirt buildup over time
StovepipeHeatBuildup = true           # Simulate heat from rapid firing
StovepipeAmmoQualityAffectsJams = true # Ammunition quality affects reliability
StovepipeWeaponConditionTracking = true # Track weapon condition
StovepipePlayMalfunctionSounds = true  # Play jam sound effects
StovepipeShowMalfunctionParticles = true # Show jam particle effects
StovepipeEnableBatchJamming = true    # Allow multiple weapons to jam at once

# === TIMING SETTINGS ===
# Control timing and cooldowns for jamming
StovepipeJamCooldownSeconds = 5       # Minimum time between jams on same weapon
StovepipeAutoClearDelaySeconds = 15   # Auto-clear delay (if enabled)
StovepipeCacheLifetimeMinutes = 15    # How long to cache jam capability
StovepipeMaxCacheSize = 500           # Maximum cached weapons
StovepipeBatchSize = 5                # Max weapons to jam in one batch

# === SIMULATION SETTINGS ===
# Advanced simulation parameters
StovepipeMaxDirtLevel = 100           # Maximum dirt accumulation
StovepipeMaxHeatLevel = 100           # Maximum heat buildup

# === DEBUG OPTIONS ===
StovepipeDebugMode = false            # Enable debug output
StovepipeVerboseLogging = false       # Detailed logging for troubleshooting

[Meatyceiver 2 Integration]
# Meatyceiver 2 mod transforms weapons into meat versions
# Thunderstore: https://thunderstore.io/c/h3vr/p/Potatoes/Meatyceiver_2/
# GitHub: https://github.com/potatoes1286/Meatyceiver2-Redux
EnableMeatyceiverIntegration=true

# Basic Transformation Chances
MeatyceiverChanceNormal=0.02          # 2% chance for normal spawns
MeatyceiverChanceElite=0.01           # 1% chance for elite sosigs (more reliable weapons)
MeatyceiverChanceChaos=0.15           # 15% chance in chaos mode (increased from 10%)
MeatyceiverChancePlayer=0.05          # 5% chance for player-spawned weapons

# Advanced Transformation Settings
MeatyceiverForceTransformOnChaos=false     # Force transformation in chaos mode regardless of chance
MeatyceiverAllowMultipleTransforms=false   # Allow weapons to be transformed multiple times
MeatyceiverPreserveAmmo=true               # Preserve ammunition when transforming
MeatyceiverPreserveAttachments=true        # Preserve weapon attachments during transformation

# Contextual Enhancement Chances
MeatyceiverSosigWeaponChance=0.03     # 3% chance for sosig weapons
MeatyceiverEnemyWeaponChance=0.04     # 4% chance for enemy weapons (slightly higher)
MeatyceiverAllyWeaponChance=0.02      # 2% chance for ally weapons
MeatyceiverBossWeaponChance=0.001     # 0.1% chance for boss weapons (very rare, premium weapons)

# Weapon Category Multipliers
MeatyceiverPistolMultiplier=1.2       # 20% higher chance for pistols
MeatyceiverRifleMultiplier=1.0        # Normal chance for rifles
MeatyceiverShotgunMultiplier=0.8      # 20% lower chance for shotguns
MeatyceiverSMGMultiplier=1.5          # 50% higher chance for SMGs
MeatyceiverSniperMultiplier=0.5       # 50% lower chance for sniper rifles

# Audio and Visual Effects
MeatyceiverPlayTransformSound=true         # Play sound effect when transformation occurs
MeatyceiverShowTransformParticles=true     # Show particle effects during transformation
MeatyceiverTransformSoundVolume=0.8        # Volume for transformation sounds (0.0-1.0)
MeatyceiverLogRareEvents=true              # Log rare transformation events

# Performance and Caching
MeatyceiverEnableCaching=true              # Cache transformation results for performance
MeatyceiverCacheSize=1000                  # Maximum number of cached transformation results
MeatyceiverCacheClearInterval=300          # Clear cache every 5 minutes (300 seconds)

# Integration Behavior
MeatyceiverRespectOriginalChances=true     # Respect Meatyceiver 2's own chance settings when available
MeatyceiverOverrideChances=false           # Override Meatyceiver 2's chances with H3TVR settings
MeatyceiverUseContextualLogic=true         # Use H3TVR's contextual transformation logic

# Debugging and Development
MeatyceiverDebugMode=false                 # Enable debug logging for Meatyceiver integration
MeatyceiverVerboseLogging=false            # Enable verbose logging for all transformation attempts
MeatyceiverTestMode=false                  # Enable test mode (higher chances for testing)

[Magazine Patcher Integration]
# Magazine Patcher adds enhanced magazine compatibility
# GitHub: https://github.com/O-Deka-K/MagazinePatcher
EnableMagazinePatcherIntegration=true
PreferMagazinePatcherOverH3VR=true
UseEnhancedCompatibilityScoring=true
MagazinePatcherPriority=High

[Dependency Management]
# General settings for optional dependency handling
LogDependencyStatus=true
ShowMissingDependencyWarnings=true
RefreshDependenciesOnSceneLoad=true
EnableDependencyStatusInUI=true

# Auto-detection settings
AutoDetectMeatyceiver2=true               # Automatically detect Meatyceiver 2 via multiple methods
FallbackToLegacyMeatyceiver=true          # Fallback to legacy Meatyceiver if Meatyceiver 2 not found
UseBepInExPluginDetection=true            # Use BepInEx plugin manager for detection
UseReflectionDetection=true               # Use reflection-based detection as fallback

[Integration Behavior]
# How H3TVR behaves when dependencies are missing
FallbackToStandardBehavior=true
DisableEnhancementsIfMissing=false
LogMissingDependencyAttempts=true
ContinueWithoutOptionalFeatures=true

# Performance settings
EnablePerformanceMonitoring=true          # Monitor performance impact of integrations
MaxIntegrationTimePerFrame=5              # Maximum milliseconds per frame for integrations
DisableIntegrationsOnLowPerformance=true  # Disable integrations if performance issues detected