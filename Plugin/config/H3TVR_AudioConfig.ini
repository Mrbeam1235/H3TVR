# H3TVR Enhanced Edition - Audio Configuration
# This file contains settings for all audio effects in the plugin

[General]
# Master volume control for all H3TVR audio effects (0.0 to 1.0)
MasterVolume=1.0

# Enable/disable all audio effects
EnableAudioEffects=true

# Enable 3D positional audio
EnableSpatialAudio=true

# Maximum distance for 3D audio effects (in Unity units)
MaxAudioDistance=50.0

# Maximum number of simultaneous audio sources
MaxSimultaneousSounds=10

[Volume Levels]
# Individual volume controls for different effect categories (0.0 to 1.0)

# Volume for general effect sounds (explosions, impacts, etc.)
EffectsVolume=0.8

# Volume for weapon-related sounds (gun spawns, fire mode changes)
WeaponSoundsVolume=0.9

# Volume for ambient/background sounds (slomo effects, etc.)
AmbientSoundsVolume=0.6

# Specific effect volumes
ShurikenVolume=0.8
HydrationVolume=0.7
SlomoVolume=0.9
DangerCloseVolume=1.0
SkittySubGunVolume=0.8
DestroyQuickbeltVolume=0.6
WondertoyVolume=0.7

[Audio Files]
# Audio file mappings for different effects
# You can customize these by placing audio files in the H3TVR_Audio folder
# Supported formats: .wav, .ogg, .mp3

# Shuriken sounds
ShurikenThrow=shuriken_throw.wav,shuriken_whoosh.wav,shuriken_impact.wav
ShurikenSpawn=shuriken_spawn.wav,metal_clink.wav

# Hydration sounds  
HydrationDrink=hydration_drink.wav,water_pour.wav,bottle_open.wav
HydrationSpawn=bottle_spawn.wav,water_splash.wav

# Slomo sounds
SlomoStart=slomo_start.wav,time_slow.wav,whoosh_slow.wav
SlomoEnd=slomo_end.wav,time_normal.wav,whoosh_fast.wav
SlomoActive=slomo_ambient.wav,time_distortion.wav

# Danger Close sounds
DangerClose=danger_close.wav,explosion_distant.wav,artillery_incoming.wav
Explosion=explosion_large.wav,explosion_medium.wav,explosion_small.wav

# Weapon sounds
SkittySubGun=gun_spawn.wav,weapon_materialize.wav,metal_clank.wav
GunSpawn=gun_appear.wav,weapon_ready.wav

# Destruction sounds
DestroyQuickbelt=items_destroy.wav,quickbelt_clear.wav,magic_poof.wav
ItemDestroy=item_vanish.wav,destroy_sound.wav

# Wondertoy sounds
Wondertoy=wondertoy_spawn.wav,toy_appear.wav,magic_sparkle.wav
WondertoyActivate=toy_activate.wav,magic_chime.wav

# UI sounds
UIConfirm=ui_confirm.wav,beep_confirm.wav
UIError=ui_error.wav,beep_error.wav
SystemReady=system_ready.wav,startup_chime.wav

[Notes]
# Place custom audio files in the H3TVR_Audio folder next to the plugin DLL
# Files should be relatively short (under 10 seconds for most effects)
# Use moderate volumes in your audio files as the plugin has volume controls
# Multiple files can be specified for each effect (separated by commas)
# The plugin will randomly select from available files for variety