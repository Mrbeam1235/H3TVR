# H3TVR Enhanced Edition - Audio Configuration
# This file contains settings for all audio effects in the plugin
# Every sound effect can now be customized with your own audio files!

[General]
# Master volume control for all H3TVR audio effects (0.0 to 1.0)
MasterVolume=1.0

# Enable/disable all audio effects
EnableAudioEffects=true

# Enable 3D positional audio
EnableSpatialAudio=true

# Maximum distance for 3D audio effects (in Unity units)
MaxAudioDistance=50.0

# Maximum number of simultaneous audio sources
MaxSimultaneousSounds=10

[Volume Levels]
# Individual volume controls for different effect categories (0.0 to 1.0)

# Volume for general effect sounds (explosions, impacts, etc.)
EffectsVolume=0.8

# Volume for weapon-related sounds (gun spawns, fire mode changes)
WeaponSoundsVolume=0.9

# Volume for ambient/background sounds (slomo effects, etc.)
AmbientSoundsVolume=0.6

# Specific effect volumes
ShurikenVolume=0.8
HydrationVolume=0.7
SlomoVolume=0.9
DangerCloseVolume=1.0
SkittySubGunVolume=0.8
DestroyQuickbeltVolume=0.6
WondertoyVolume=0.7

[Custom Audio Files]
# ============================================================================
# FULLY CUSTOMIZABLE AUDIO FILE PATHS
# ============================================================================
# 
# HOW TO USE:
# 1. Place your custom audio files in the H3TVR_Audio folder (next to the plugin DLL)
# 2. Update the file paths below to point to your custom audio files
# 3. You can specify multiple files separated by commas - one will be randomly selected
# 4. Supported formats: .wav, .ogg, .mp3, .aif, .aiff
# 5. Use relative paths from the H3TVR_Audio folder, or absolute paths
#
# EXAMPLES:
#   Single file:     MyExplosion.wav
#   Multiple files:  explosion1.wav,explosion2.wav,explosion3.wav
#   Subfolder:       custom_sounds/my_explosion.wav
#   Absolute path:   C:\MyAudioFiles\explosion.wav
#
# ============================================================================

# --- SHURIKEN SOUNDS ---
# Sounds when throwing/spawning shurikens
ShurikenThrowSounds=shuriken_throw.wav,shuriken_whoosh.wav,shuriken_impact.wav
ShurikenSpawnSounds=shuriken_spawn.wav,metal_clink.wav

# --- HYDRATION SOUNDS ---
# Sounds for drinking and spawning water bottles
HydrationDrinkSounds=hydration_drink.wav,water_pour.wav,bottle_open.wav
HydrationSpawnSounds=bottle_spawn.wav,water_splash.wav

# --- SLOMO (SLOW MOTION) SOUNDS ---
# Sounds for time manipulation effects
SlomoStartSounds=slomo_start.wav,time_slow.wav,whoosh_slow.wav
SlomoEndSounds=slomo_end.wav,time_normal.wav,whoosh_fast.wav
SlomoActiveSounds=slomo_ambient.wav,time_distortion.wav

# --- DANGER CLOSE SOUNDS ---
# Explosive and warning sounds
DangerCloseSounds=danger_close.wav,explosion_distant.wav,artillery_incoming.wav
ExplosionSounds=explosion_large.wav,explosion_medium.wav,explosion_small.wav

# --- WEAPON SPAWN SOUNDS ---
# Sounds when weapons appear/spawn
SkittySubGunSounds=gun_spawn.wav,weapon_materialize.wav,metal_clank.wav
GenericGunSpawnSounds=gun_appear.wav,weapon_ready.wav

# --- DESTRUCTION SOUNDS ---
# Sounds for item/quickbelt destruction
DestroyQuickbeltSounds=items_destroy.wav,quickbelt_clear.wav,magic_poof.wav
ItemDestroySounds=item_vanish.wav,destroy_sound.wav

# --- WONDERTOY SOUNDS ---
# Sounds for wondertoy spawn and activation
WondertoySpawnSounds=wondertoy_spawn.wav,toy_appear.wav,magic_sparkle.wav
WondertoyActivateSounds=toy_activate.wav,magic_chime.wav

# --- UI SOUNDS ---
# User interface feedback sounds
UIConfirmSounds=ui_confirm.wav,beep_confirm.wav
UIErrorSounds=ui_error.wav,beep_error.wav
SystemReadySounds=system_ready.wav,startup_chime.wav

# --- STOVEPIPE MALFUNCTION SOUNDS ---
# Weapon malfunction sounds (requires Stovepipe mod)
StovepipeJamSounds=stovepipe/weapon_jam.wav,stovepipe/stovepipe_jam.wav
StovepipeDoubleFeedSounds=stovepipe/double_feed.wav
StovepipeFailureToFeedSounds=stovepipe/failure_to_feed.wav
StovepipeFailureToEjectSounds=stovepipe/failure_to_eject.wav
StovepipeFailureToFireSounds=stovepipe/failure_to_fire.wav
StovepipeHangFireSounds=stovepipe/hang_fire.wav
StovepipeClearJamSounds=stovepipe/jam_cleared.wav
StovepipeCyclingSounds=stovepipe/action_cycling.wav
StovepipeGenericMalfunctionSounds=stovepipe/generic_malfunction.wav

[Notes]
# ============================================================================
# TIPS FOR CUSTOM AUDIO:
# ============================================================================
# 
# - Keep effect sounds short (1-3 seconds for most effects)
# - Use moderate volumes in your source files (H3TVR has volume controls)
# - 3D positional audio works best with mono audio files
# - Stereo files work fine for UI sounds and 2D effects
# - For variety, specify multiple files for the same effect
# - The plugin randomly selects from available files
# - If a file is missing, the effect will be skipped (no crash)
# 
# FOLDER ORGANIZATION EXAMPLE:
#   H3TVR_Audio/
#   ??? explosions/
#   ?   ??? explosion1.wav
#   ?   ??? explosion2.wav
#   ?   ??? explosion3.wav
#   ??? weapons/
#   ?   ??? gun_spawn.wav
#   ?   ??? weapon_ready.wav
#   ??? stovepipe/
#       ??? weapon_jam.wav
#       ??? jam_cleared.wav
#
# Then reference them like:  explosions/explosion1.wav,explosions/explosion2.wav
# ============================================================================