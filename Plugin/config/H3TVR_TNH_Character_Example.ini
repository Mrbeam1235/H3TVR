# H3TVR TNH Customizer - Custom Character Template
# This file defines a custom TNH character with unique settings and equipment
# Compatible with Nicole's TNH_Customizer: https://thunderstore.io/c/h3vr/p/Nicole/TNH_Customizer/

[Character Info]
# Character identification
CharacterName=MyCustomCharacter
DisplayName=My Custom Character
Description=A custom TNH character with personalized settings

[Starting Settings]
# Initial equipment and resources
StartingTokens=3
StartingHealth=1000
RequiredHolds=5

# Starting equipment (item IDs from H3VR)
# Format: Comma-separated list of FVRObject ItemIDs
StartingEquipment=

[Weapon Pools]
# Define custom weapon pools for supply points
# Format: Comma-separated list of FVRObject ItemIDs

# Primary weapons (rifles, shotguns, etc.)
PrimaryWeaponPool=

# Secondary weapons (pistols, SMGs)
SecondaryWeaponPool=

# Tertiary (melee, special weapons)
TertiaryWeaponPool=

# Shields
ShieldPool=

# Consumables (grenades, ammo, health)
ConsumablePool=

[Enemy Settings]
# Enemy sosig types that will spawn
# Format: Comma-separated list of SosigEnemyID enum values
# Examples: M_Swat_Scout, M_Swat_Heavy, M_Swat_Sniper, etc.
EnemyPool=M_Swat_Scout,M_Swat_Heavy,M_Swat_Sniper

# Enemy stat modifiers
EnemyHealthMultiplier=1.0
EnemySpeedMultiplier=1.0

[Player Modifiers]
# Player stat and resource modifiers
UnlimitedAmmo=false
UnlimitedTokens=false
HealthMultiplier=1.0
DisableEncryption=false

[Progression]
# Progression settings
EnableCustomPools=true
EnableProgressionMods=true

# Advanced Options (Future)
# CustomSpawnRules=
# CustomSupplyTypes=
# CustomObjectives=

