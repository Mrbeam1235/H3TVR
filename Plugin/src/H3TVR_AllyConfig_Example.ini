# H3TVR Ally Sosig Configuration
# This file defines loadouts for friendly sosigs
# Each section [SectionName] defines a different loadout
# 
# Configuration Options:
# description - Text description of the loadout
# iff - IFF code (0=friendly, 1=enemy, 2=neutral, 3+=custom)
# followplayer - Whether the sosig should follow the player (true/false)
# weaponprimary - Primary weapon identifier
# weaponsecondary - Secondary weapon identifier  
# weapontertiary - Tertiary weapon/equipment identifier
# healthmultiplier - Health multiplier (1.0 = normal, 2.0 = double health)
# speedmultiplier - Speed multiplier (1.0 = normal, 1.5 = 50% faster)
# enablevoice - Enable voice clips for this sosig (true/false)
# voiceclips - Comma-separated list of voice clip names
# Armor chances are between 0.0 (never) and 1.0 (always)

