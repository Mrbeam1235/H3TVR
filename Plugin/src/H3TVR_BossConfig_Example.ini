# H3TVR Boss Sosig Configuration
# This file defines loadouts for boss-level enemies with special abilities
# Bosses are powerful enemies with enhanced stats, special effects, and unique behaviors
# Each section [SectionName] defines a different boss type
#
# Boss-Specific Configuration Options:
# isboss - Must be true for boss loadouts
# bossscale - Size multiplier for the boss (1.0 = normal, 1.5 = 50% larger)
# hasdamageimmunity - Temporary invulnerability on spawn (true/false)
# immunityduration - How long immunity lasts in seconds
# hasspecialeffects - Enable visual/audio effects (true/false)
# bossmusic - Background music file to play during boss fight
# spawneffect - Visual effect when boss spawns
# deatheffect - Visual effect when boss dies
# minionstospawn - Number of minions to spawn with the boss
# miniontypes - Types of minions (comma-separated, must match enemy config names)
# regenerateshealth - Boss slowly heals over time (true/false)
# regenerationrate - Health regeneration per second (0.1 = 10% per second)
# enragesatlowhealth - Boss becomes more aggressive when injured (true/false)
# enragethreshold - Health percentage that triggers enrage (0.3 = 30%)
# enragemultiplier - Damage/speed boost when enraged (2.0 = double)

