# H3TVR Sosig Scenario Configuration
# This file defines wave-based scenarios and survival modes

[ScenarioDefaults]
# Default settings for all scenarios
DefaultDifficulty=Normal
DefaultWaveDelay=30.0
DefaultSpawnRadius=25.0
DefaultMaxSosigs=20
EnableBossWaves=true
BossWaveInterval=5

[SurvivalMode]
Name=Survival Mode
Description=Endless waves of increasingly difficult enemies
Type=Survival
Difficulty=Normal
WaveDelay=25.0
SpawnRadius=30.0
MaxSosigs=15
DifficultyScaling=1.2
WaveCount=Infinite
AllowPlayerRespawn=true
WaveComposition=Mixed

[BossRushMode]
Name=Boss Rush
Description=Face powerful boss sosigs in succession
Type=BossRush
Difficulty=Hard
WaveDelay=45.0
SpawnRadius=35.0
MaxSosigs=5
DifficultyScaling=1.5
WaveCount=10
AllowPlayerRespawn=false
WaveComposition=Boss

[DefenseMode]
Name=Base Defense
Description=Protect your position from waves of attackers
Type=Defense
Difficulty=Normal
WaveDelay=20.0
SpawnRadius=40.0
MaxSosigs=25
DifficultyScaling=1.1
WaveCount=15
AllowPlayerRespawn=true
WaveComposition=Assault
DefensePoint=Player

[AssaultMode]
Name=Assault Mission
Description=Clear enemy positions in structured waves
Type=Assault
Difficulty=Hard
WaveDelay=35.0
SpawnRadius=20.0
MaxSosigs=12
DifficultyScaling=1.3
WaveCount=8
AllowPlayerRespawn=false
WaveComposition=Defensive

[TrainingMode]
Name=Training Scenario
Description=Practice with controllable enemy spawns
Type=Training
Difficulty=Easy
WaveDelay=60.0
SpawnRadius=15.0
MaxSosigs=8
DifficultyScaling=0.8
WaveCount=5
AllowPlayerRespawn=true
WaveComposition=Basic

# Wave Compositions
[WaveCompositions]
Mixed=AssaultRifleLoadout:0.3,SMGLoadout:0.2,SniperLoadout:0.1,ShotgunLoadout:0.2,LMGLoadout:0.1,PistolLoadout:0.1
Boss=SniperBoss:0.4,HeavyBoss:0.4,AssaultBoss:0.2
Assault=AssaultRifleLoadout:0.4,SMGLoadout:0.3,LMGLoadout:0.2,ShotgunLoadout:0.1
Defensive=SniperLoadout:0.3,LMGLoadout:0.3,AssaultRifleLoadout:0.2,ShotgunLoadout:0.2
Basic=PistolLoadout:0.4,AssaultRifleLoadout:0.3,SMGLoadout:0.3

# Difficulty Modifiers
[DifficultySettings]
Easy_HealthModifier=0.7
Easy_DamageModifier=0.8
Easy_AccuracyModifier=0.6
Easy_SpeedModifier=0.8

Normal_HealthModifier=1.0
Normal_DamageModifier=1.0
Normal_AccuracyModifier=1.0
Normal_SpeedModifier=1.0

Hard_HealthModifier=1.5
Hard_DamageModifier=1.3
Hard_AccuracyModifier=1.2
Hard_SpeedModifier=1.1

Expert_HealthModifier=2.0
Expert_DamageModifier=1.6
Expert_AccuracyModifier=1.5
Expert_SpeedModifier=1.3

# Special Events
[SpecialEvents]
# Events that can occur during scenarios
BlitzEvent_Chance=0.1
BlitzEvent_Description=Rapid spawn burst for 30 seconds
BlitzEvent_SpawnMultiplier=3.0
BlitzEvent_Duration=30.0

SniperEvent_Chance=0.15
SniperEvent_Description=Elite sniper sosigs spawn at distance
SniperEvent_LoadoutOverride=SniperLoadout
SniperEvent_Count=3

HealEvent_Chance=0.05
HealEvent_Description=Player receives health restoration
HealEvent_HealAmount=50.0

AmmoEvent_Chance=0.2
AmmoEvent_Description=Ammo resupply spawns near player
AmmoEvent_AmmoMultiplier=2.0